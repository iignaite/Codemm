# Unsigned builds: no signing identity, no notarization.
appId: org.codemm.desktop
productName: Codemm
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**
  - "!out/shared/**"
  - package.json
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.education
  identity: null
  notarize: false
win:
  target:
    - target: nsis
      arch: [x64]
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Education
  maintainer: Codemm contributors
