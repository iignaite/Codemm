name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Typecheck, build and the unit tests on every OS Codemm supports.
  #
  # GitHub's macOS and Windows runners can't run Linux containers (no nested
  # virtualization for Docker Desktop on macOS, Windows containers only on
  # Windows), so the Docker integration tests run on Linux only. On macOS and
  # Windows, the sandbox and judge are covered by unit tests and by reasoning.
  # The WASI engine needs no containers, so its tests run on all three.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The WASI engine's tests (DESIGN §4.5) run real wasmtime on every OS: the official release, pinned by SHA-256.
      - name: Install wasmtime 50.0.0
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) target=x86_64-linux; ext=tar.xz; sum=77c19ee0437991f9ac7837b9c269d9c7076744f85dad263fea5214cc2723c7ff ;;
            macOS-ARM64) target=aarch64-macos; ext=tar.xz; sum=323dc098dc0455d60f396c404627e967b7033ffcfa29abfffb243126cf82c9d6 ;;
            macOS-X64) target=x86_64-macos; ext=tar.xz; sum=ad14d9fb6a51d1633318426d6df21734127faddc81fe18a3afd70c5964eabeb5 ;;
            Windows-X64) target=x86_64-windows; ext=zip; sum=cea9ccc700aaccb2b5507e96ac990ba60104bd7ab39284fb2e67cb64d58efcc4 ;;
            *) echo "No pinned wasmtime for ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          name="wasmtime-v50.0.0-$target"
          file="$RUNNER_TEMP/$name.$ext"
          curl -fsSL --retry 3 -o "$file" "https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.0/$name.$ext"
          node -e 'const h = require("crypto").createHash("sha256").update(require("fs").readFileSync(process.argv[1])).digest("hex"); if (h !== process.argv[2]) { console.error(`wasmtime SHA-256 ${h}, expected ${process.argv[2]}`); process.exit(1); }' "$file" "$sum"
          if [ "$ext" = zip ]; then 7z x -bd -o"$RUNNER_TEMP" "$file" > /dev/null; else tar -xJf "$file" -C "$RUNNER_TEMP"; fi
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - run: wasmtime --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # TEMPORARY: why a sealed run folder can't be mapped from the tests on Windows. Removed once found.
      - name: Diagnose the seal on Windows
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          cat > diag.mjs <<'JS'
          import { spawn, spawnSync } from "node:child_process";
          import { mkdirSync, writeFileSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { join, resolve } from "node:path";
          process.env.CODEMM_HOME = join(tmpdir(), "diag-home-2");
          const { prepareWasi, sealReadOnly, startWasi, wasiArgs } = await import("./dist/wasi.js");
          const { stageRunFolder } = await import("./dist/runs.js");
          const toolchain = { root: resolve("test/fixtures/wasi"), sha256: "diag-cat", module: "cat.wat", dirs: {}, env: {} };
          const engine = await prepareWasi(toolchain);
          const S = process.env.SystemRoot;
          const envs = {
            sys: { SystemRoot: S },
            inherited: process.env,
            temp: { SystemRoot: S, TEMP: process.env.TEMP, TMP: process.env.TMP },
            profile: { SystemRoot: S, USERPROFILE: process.env.USERPROFILE, LOCALAPPDATA: process.env.LOCALAPPDATA, APPDATA: process.env.APPDATA },
            path: { SystemRoot: S, windir: process.env.windir, PATH: process.env.PATH, PATHEXT: process.env.PATHEXT, ComSpec: process.env.ComSpec },
          };
          const asyncRun = (args, opts) => new Promise((done) => {
            const c = spawn(engine.bin, args, { stdio: ["pipe", "pipe", "pipe"], ...opts });
            let out = "", err = "";
            c.stdout.on("data", (b) => (out += b));
            c.stderr.on("data", (b) => (err += b));
            c.on("error", (e) => done({ status: -1, stdout: out, stderr: e.message }));
            c.on("close", (status) => done({ status, stdout: out, stderr: err }));
            c.stdin.end("hi\n");
          });
          const show = (label, r) => console.log(`${label}: exit ${r.status} stdout ${JSON.stringify(r.stdout)} stderr ${JSON.stringify((r.stderr || "").slice(0, 200))}`);
          for (const sealed of [false, true]) {
            const folder = stageRunFolder();
            const src = join(folder.dir, "src");
            mkdirSync(src, { recursive: true });
            writeFileSync(join(src, "main.txt"), "x");
            if (sealed) sealReadOnly(folder.dir);
            const args = wasiArgs({ engine, toolchain, src, run: "/work/src/main.txt", memoryMb: 256, timeMs: 5000 });
            const tag = sealed ? "sealed" : "unsealed";
            show(`${tag} spawnSync sys`, spawnSync(engine.bin, args, { input: "hi\n", env: envs.sys, encoding: "utf8" }));
            show(`${tag} spawnSync sys windowsHide`, spawnSync(engine.bin, args, { input: "hi\n", env: envs.sys, encoding: "utf8", windowsHide: true }));
            for (const [name, env] of Object.entries(envs)) show(`${tag} spawn ${name}`, await asyncRun(args, { env }));
            show(`${tag} spawn sys windowsHide`, await asyncRun(args, { env: envs.sys, windowsHide: true }));
            const r = await startWasi({ engine, toolchain, src, run: "/work/src/main.txt", memoryMb: 256, timeMs: 5000, input: Buffer.from("hi\n"), outputCap: 1 << 20 }).done;
            show(`${tag} startWasi`, { status: r.exit, stdout: r.stdout.toString(), stderr: r.stderr });
          }
          JS
          node diag.mjs
          whoami //priv
      - run: npm run test:unit
        env:
          CODEMM_REQUIRE_WASMTIME: "1"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test (Docker tests required)
        run: npm test
        env:
          CODEMM_REQUIRE_DOCKER: "1"
          # Fixtures with big images (the Maven + JUnit track, about 600 MB) run here, not in a default local run.
          CODEMM_BIG_IMAGES: "1"

  # The newest Docker Engine too: Docker Desktop on macOS and Windows ships it, and a new version can change what
  # Docker reports (Docker 29 left Config.Volumes out of image records).
  docker-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: docker/setup-docker-action@v4
        with:
          version: latest
          set-host: true
      - run: docker version
      - run: npm ci
      - run: npm run build
      - name: Test (Docker tests required)
        run: npm test
        env:
          CODEMM_REQUIRE_DOCKER: "1"
