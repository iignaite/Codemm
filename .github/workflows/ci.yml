name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Typecheck, build and the unit tests on every OS Codemm supports.
  #
  # GitHub's macOS and Windows runners can't run Linux containers (no nested
  # virtualization for Docker Desktop on macOS, Windows containers only on
  # Windows), so the Docker integration tests run on Linux only. On macOS and
  # Windows, the sandbox and judge are covered by unit tests and by reasoning.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit

  docker:
    # The runner's own Docker, and the newest Docker Engine: Docker Desktop on macOS and Windows ships the newest
    # engine, and a new version can change what Docker reports (Docker 29 left Config.Volumes out of image records).
    name: docker (${{ matrix.engine }})
    strategy:
      fail-fast: false
      matrix:
        engine: [runner, latest]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: The newest Docker Engine
        if: matrix.engine == 'latest'
        uses: docker/setup-docker-action@v4
        with:
          version: latest
          set-host: true
      - run: docker version
      - run: npm ci
      - run: npm run build
      - name: Test (Docker tests required)
        run: npm test
        env:
          CODEMM_REQUIRE_DOCKER: "1"
