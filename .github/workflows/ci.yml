name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Typecheck, build and the unit tests on every OS Codemm supports.
  #
  # GitHub's macOS and Windows runners can't run Linux containers (no nested
  # virtualization for Docker Desktop on macOS, Windows containers only on
  # Windows), so the Docker integration tests run on Linux only. On macOS and
  # Windows, the sandbox and judge are covered by unit tests and by reasoning.
  # The WASI engine needs no containers, so its tests run on all three.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The WASI engine's tests (DESIGN §4.5) run real wasmtime on every OS: the official release, pinned by SHA-256.
      - name: Install wasmtime 50.0.0
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) target=x86_64-linux; ext=tar.xz; sum=77c19ee0437991f9ac7837b9c269d9c7076744f85dad263fea5214cc2723c7ff ;;
            macOS-ARM64) target=aarch64-macos; ext=tar.xz; sum=323dc098dc0455d60f396c404627e967b7033ffcfa29abfffb243126cf82c9d6 ;;
            macOS-X64) target=x86_64-macos; ext=tar.xz; sum=ad14d9fb6a51d1633318426d6df21734127faddc81fe18a3afd70c5964eabeb5 ;;
            Windows-X64) target=x86_64-windows; ext=zip; sum=cea9ccc700aaccb2b5507e96ac990ba60104bd7ab39284fb2e67cb64d58efcc4 ;;
            *) echo "No pinned wasmtime for ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          name="wasmtime-v50.0.0-$target"
          file="$RUNNER_TEMP/$name.$ext"
          curl -fsSL --retry 3 -o "$file" "https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.0/$name.$ext"
          node -e 'const h = require("crypto").createHash("sha256").update(require("fs").readFileSync(process.argv[1])).digest("hex"); if (h !== process.argv[2]) { console.error(`wasmtime SHA-256 ${h}, expected ${process.argv[2]}`); process.exit(1); }' "$file" "$sum"
          if [ "$ext" = zip ]; then 7z x -bd -o"$RUNNER_TEMP" "$file" > /dev/null; else tar -xJf "$file" -C "$RUNNER_TEMP"; fi
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - run: wasmtime --version
      # TEMPORARY: why wasmtime exits 1 on Windows under the seal or the empty environment. Removed once found.
      - name: Diagnose wasmtime on Windows
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/diag.mjs" <<'JS'
          import { spawnSync } from "node:child_process";
          import { chmodSync, mkdirSync, writeFileSync } from "node:fs";
          import { join, resolve } from "node:path";
          const T = process.env.RUNNER_TEMP;
          const W = spawnSync("where", ["wasmtime"], { encoding: "utf8" }).stdout.split(/\r?\n/)[0].trim();
          const icacls = join(process.env.SystemRoot, "System32", "icacls.exe");
          const sys = { SystemRoot: process.env.SystemRoot };
          const fx = (n) => resolve("test/fixtures/wasi", n + ".wat");
          const show = (label, r) => console.log(`${label}: exit ${r.status} stdout ${JSON.stringify(r.stdout)} stderr ${JSON.stringify((r.stderr || "").slice(0, 600))}`);
          const run = (label, args, env, input = "hi\n") => show(label, spawnSync(W, args, { input, env, encoding: "utf8" }));
          const pre = ["run", "--allow-precompiled", "-C", "cache=n"];
          for (const n of ["cat", "write"]) show(`compile ${n}`, spawnSync(W, ["compile", "-W", "epoch-interruption=y", fx(n), "-o", join(T, n + ".cwasm")], { env: sys, encoding: "utf8" }));
          run("A text module, inherited env", ["run", fx("cat")], process.env);
          run("B text module, empty env", ["run", fx("cat")], sys);
          run("C precompiled, inherited env", [...pre, join(T, "cat.cwasm")], process.env);
          run("D precompiled, empty env", [...pre, join(T, "cat.cwasm")], sys);
          const fresh = (name) => { const d = join(T, name, "src"); mkdirSync(d, { recursive: true }); writeFileSync(join(d, "main.txt"), "x"); chmodSync(join(d, "main.txt"), 0o444); return d; };
          const e = fresh("plain");
          run("E --dir, no deny, empty env", [...pre, "--dir", `${e}::/work/src`, join(T, "cat.cwasm")], sys);
          run("E2 --dir, no deny, write fixture", [...pre, "--dir", `${e}::/work/src`, join(T, "write.cwasm")], sys);
          const variants = {
            V1: [["(OI)(CI)(W,D,DC)"]],
            V2: [["(WD,AD,DC)"], ["(OI)(CI)(IO)(W,D,DC)"]],
            V3: [["(OI)(CI)(WD,AD,D,DC)"]],
            V4: [["(OI)(CI)(WD,AD,DC)"]],
            V5: [["(OI)(CI)(WD,AD,WEA,WA,D,DC)"]],
          };
          for (const [v, aces] of Object.entries(variants)) {
            const d = fresh(v);
            for (const [ace] of aces) show(`${v} icacls ${ace}`, spawnSync(icacls, [d, "/deny", `*S-1-1-0:${ace}`], { encoding: "utf8" }));
            run(`${v} cat`, [...pre, "--dir", `${d}::/work/src`, join(T, "cat.cwasm")], sys);
            run(`${v} write`, [...pre, "--dir", `${d}::/work/src`, join(T, "write.cwasm")], sys);
            show(`${v} remove`, spawnSync(icacls, [d, "/remove:d", "*S-1-1-0"], { encoding: "utf8" }));
          }
          JS
          node "$RUNNER_TEMP/diag.mjs"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
        env:
          CODEMM_REQUIRE_WASMTIME: "1"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test (Docker tests required)
        run: npm test
        env:
          CODEMM_REQUIRE_DOCKER: "1"
          # Fixtures with big images (the Maven + JUnit track, about 600 MB) run here, not in a default local run.
          CODEMM_BIG_IMAGES: "1"

  # The newest Docker Engine too: Docker Desktop on macOS and Windows ships it, and a new version can change what
  # Docker reports (Docker 29 left Config.Volumes out of image records).
  docker-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: docker/setup-docker-action@v4
        with:
          version: latest
          set-host: true
      - run: docker version
      - run: npm ci
      - run: npm run build
      - name: Test (Docker tests required)
        run: npm test
        env:
          CODEMM_REQUIRE_DOCKER: "1"
