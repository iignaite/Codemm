name: Desktop

on:
  pull_request:
    paths:
      - desktop/**
      - .github/workflows/desktop.yml
  push:
    branches: [main]
    paths:
      - desktop/**
      - .github/workflows/desktop.yml

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke test (Electron)
        run: xvfb-run --auto-servernum npm run test:smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: desktop/test-results
          retention-days: 7

  dist:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: codemm-desktop-${{ runner.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error
          retention-days: 14
